package:
  name: titancsa-interceptor
  version: "1.0.0"

source:
  url: https://github.com/TitanCSA/Interceptor-MultiLang/archive/8c1aa522081d83e51a6060c1877f125c9ae8135a.tar.gz
  sha256: 8feb8fef3b5c2d499bfe2c0b0dca984e8b888aea0fc2dfb4f082583e0832140e

build:
  number: 0
  skip: true  # [not win64]

requirements:
  build:
    - {{ compiler("c") }}
    - {{ compiler("cxx") }}
    - cmake >=3.24
    - ninja
  host:
    - python >=3.10
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=3.10

test:
  imports:
    - interceptor

about:
  home: https://github.com/TitanCSA/Interceptor-MultiLang
  summary: Windows x64 Interceptor-MultiLang SDK; driver or application installed separately.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - TitanCSA
